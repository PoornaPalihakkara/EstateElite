# ==========================================================
# Estate Elite - Application Configuration
# ==========================================================

server.port=8080
spring.application.name=estate-elite

# --- MySQL Database (create the schema first: CREATE DATABASE estate_elite;) ---
spring.datasource.url=jdbc:mysql://localhost:3306/estate_elite?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# create-drop wipes data every restart (good while developing); switch to "update" once your data matters.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- File uploads (property images / profile pictures) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# --- JWT ---
app.jwt.secret=EstateEliteSuperSecretKeyForJWTSigning_ChangeMeInProduction_SE2030
app.jwt.expiration-ms=86400000

# --- CORS (frontend served separately, e.g. http://127.0.0.1:5500 via VS Code Live Server or `python -m http.server`) ---
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,null

logging.level.com.estateelite=DEBUG
