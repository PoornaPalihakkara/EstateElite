<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* Apply saved theme before CSS paints — prevents flash & keeps pages consistent */
(function(){try{var t=localStorage.getItem("ee_theme");if(t!=="light"&&t!=="dark")t="dark";document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();
</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password - Estate Elite</title>
<link rel="stylesheet" href="css/theme.css" />
<script src="js/theme.js"></script>
</head>
<body>
<button type="button" class="theme-toggle" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme" style="position:fixed; top:18px; right:18px; z-index:100;">
  <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
</button>

<div class="auth-shell">
  <div class="auth-card card">
    <div class="auth-header">
      <div class="mark">EE</div>
      <h2>Reset your password</h2>
      <p>Enter your account email and a new password.</p>
    </div>

    <form id="reset-form">
      <div class="field">
        <label>Email address</label>
        <input type="email" id="email" required />
      </div>
      <div class="field">
        <label>New password</label>
        <input type="password" id="newPassword" minlength="8" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="reset-btn">Update password</button>
    </form>
    <p style="font-size:0.76rem; color:var(--text-muted); margin-top:14px;">
      Note: this is a simplified local-demo flow (identity verified by email only, no SMTP server) - see the Ethical Considerations section of the design document.
    </p>
    <div class="divider"></div>
    <p style="text-align:center; font-size:0.88rem;"><a href="login.html">Back to log in</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/validate.js"></script>
<script>
document.getElementById("reset-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const emailEl = document.getElementById("email");
  const passEl = document.getElementById("newPassword");
  Validate.clear(emailEl, passEl);
  if (!Validate.email(emailEl) || !Validate.password(passEl, "New password")) return;

  const btn = document.getElementById("reset-btn");
  btn.disabled = true; btn.textContent = "Updating…";
  try {
    const res = await Api.post("/api/auth/forgot-password", {
      email: emailEl.value.trim(),
      newPassword: passEl.value,
    }, false);
    Ui.toast(res.message || "Password updated");
    setTimeout(() => window.location.href = "login.html", 800);
  } catch (err) {
    Ui.errorToast(err);
    btn.disabled = false; btn.textContent = "Update password";
  }
});
</script>
</body>
</html>
